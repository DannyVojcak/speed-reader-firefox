<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      min-height: 400px;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    .header p {
      margin: 5px 0 0 0;
      opacity: 0.8;
      font-size: 14px;
    }

    .controls {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .control-group {
      margin-bottom: 15px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 500;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    input[type="number"] {
      width: 60px;
      padding: 5px 8px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 14px;
      text-align: center;
    }

    input[type="number"]::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    input[type="color"] {
      width: 40px;
      height: 30px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }

    .speed-display {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .color-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-button {
      width: 100%;
      padding: 15px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .main-button:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }

    .main-button:active {
      transform: translateY(0);
    }

    .main-button.active {
      background: #ff6b6b;
      border-color: #ff5252;
    }

    .main-button.active:hover {
      background: #ff5252;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      opacity: 0.8;
    }

    .instructions {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 15px;
      font-size: 13px;
      line-height: 1.4;
      opacity: 0.9;
    }

    .instructions h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
    }

    .instructions ul {
      margin: 0;
      padding-left: 15px;
    }

    .instructions li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚀 Speed Reader</h1>
    <p>Read faster with rapid text presentation</p>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="speed">Reading Speed (WPM)</label>
      <div class="speed-display">
        <input type="range" id="speed" min="100" max="1000" value="300" step="50">
        <input type="number" id="speedValue" min="100" max="1000" value="300" step="50">
      </div>
    </div>

    <div class="control-group">
      <label for="fontSize">Font Size</label>
      <div class="speed-display">
        <input type="range" id="fontSize" min="16" max="48" value="24" step="2">
        <input type="number" id="fontSizeValue" min="16" max="48" value="24" step="2">
      </div>
    </div>

    <div class="control-group">
      <label>Colors</label>
      <div class="color-controls">
        <div class="color-group">
          <label for="fontColor">Text:</label>
          <input type="color" id="fontColor" value="#000000">
        </div>
        <div class="color-group">
          <label for="backgroundColor">Background:</label>
          <input type="color" id="backgroundColor" value="#ffffff">
        </div>
        <div class="color-group">
          <label for="centerColor">Focus:</label>
          <input type="color" id="centerColor" value="#ff0000">
        </div>
      </div>
    </div>
  </div>

  <button id="toggleButton" class="main-button">
    Start Speed Reading
  </button>

  <div id="status" class="status">
    Click the button to start speed reading this page
  </div>

  <div class="instructions">
    <h3>How to use:</h3>
    <ul>
      <li>Click "Start Speed Reading" to begin</li>
      <li>Click anywhere on the reading screen to stop</li>
      <li>Adjust speed and colors to your preference</li>
      <li>Settings are saved automatically</li>
    </ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
