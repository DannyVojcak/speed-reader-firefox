<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <h2>Speed Reader Icon Generator</h2>
    <p>This page will help you create the required icon files for the extension.</p>
    
    <canvas id="icon16" width="16" height="16" style="border: 1px solid #ccc; margin: 5px;"></canvas>
    <canvas id="icon32" width="32" height="32" style="border: 1px solid #ccc; margin: 5px;"></canvas>
    <canvas id="icon48" width="48" height="48" style="border: 1px solid #ccc; margin: 5px;"></canvas>
    <canvas id="icon128" width="128" height="128" style="border: 1px solid #ccc; margin: 5px;"></canvas>
    
    <br><br>
    <button onclick="generateIcons()">Generate Icons</button>
    <button onclick="downloadIcons()">Download Icons</button>
    
    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Clear canvas
            ctx.clearRect(0, 0, size, size);
            
            // Background circle
            ctx.fillStyle = '#667eea';
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2 - 2, 0, 2 * Math.PI);
            ctx.fill();
            
            // White border
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, size/32);
            ctx.stroke();
            
            // Speed lines
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, size/32);
            ctx.lineCap = 'round';
            
            const lineCount = Math.max(3, Math.floor(size/8));
            for (let i = 0; i < lineCount; i++) {
                const y = size/2 - (i * size/16);
                const startX = size/4;
                const endX = size/2 - size/8;
                ctx.beginPath();
                ctx.moveTo(startX, y);
                ctx.lineTo(endX, y);
                ctx.stroke();
            }
            
            // Eye
            const eyeX = size * 0.7;
            const eyeY = size/2;
            const eyeWidth = size/6;
            const eyeHeight = size/8;
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(eyeX, eyeY, eyeWidth, eyeHeight, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            // Pupil
            ctx.fillStyle = '#667eea';
            ctx.beginPath();
            ctx.arc(eyeX + eyeWidth/4, eyeY - eyeHeight/4, size/16, 0, 2 * Math.PI);
            ctx.fill();
        }
        
        function generateIcons() {
            drawIcon(document.getElementById('icon16'), 16);
            drawIcon(document.getElementById('icon32'), 32);
            drawIcon(document.getElementById('icon48'), 48);
            drawIcon(document.getElementById('icon128'), 128);
        }
        
        function downloadIcons() {
            const sizes = [16, 32, 48, 128];
            sizes.forEach(size => {
                const canvas = document.getElementById(`icon${size}`);
                const link = document.createElement('a');
                link.download = `icon-${size}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }
        
        // Generate icons on page load
        window.onload = generateIcons;
    </script>
</body>
</html>
