<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#fff" stroke-width="4"/>
  
  <!-- Speed lines -->
  <g stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="30" y1="64" x2="50" y2="64"/>
    <line x1="35" y1="55" x2="55" y2="55"/>
    <line x1="40" y1="46" x2="60" y2="46"/>
    <line x1="45" y1="37" x2="65" y2="37"/>
  </g>
  
  <!-- Eye symbol -->
  <g fill="#fff">
    <ellipse cx="80" cy="64" rx="20" ry="12"/>
    <circle cx="80" cy="64" r="6"/>
    <circle cx="82" cy="62" r="2" fill="#667eea"/>
  </g>
  
  <!-- Text "SR" -->
  <text x="64" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">SR</text>
</svg>
